name: Build & publish release ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from the plugin header
        id: version
        run: |
          VERSION=$(grep -m1 "^ \* Version:" ofnoa-marquee.php | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Verify the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag v$TAG does not match plugin version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Lint PHP
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Build the plugin ZIP
        run: |
          mkdir -p build/ofnoa-marquee
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude 'build' \
                   --exclude 'node_modules' \
                   --exclude '.gitignore' \
                   --exclude '*.zip' \
                   ./ build/ofnoa-marquee/
          cd build && zip -qr ../ofnoa-marquee.zip ofnoa-marquee

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ofnoa-marquee.zip
          generate_release_notes: true
          name: v${{ steps.version.outputs.version }}
